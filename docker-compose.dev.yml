services:
  web-dev:
    build: { context: ., target: dev }
    ports: ['5173:5173']
    environment:
      VITE_API_BASE_URL: /api/v1
      DEV_PROXY_TARGET: http://host.docker.internal:8000
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./public:/app/public
