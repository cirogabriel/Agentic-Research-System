
[project]
name = "agentic-research-system"
version = "0.1.0"
description = "Backend de investigación multiagente (Supervisor–Worker) con RAG, LangGraph, MCP y evaluación automática."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "openai>=1.50,<3",
    "mcp>=1.12,<2",
    "sentence-transformers>=3.0,<6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
# Ragas es opcional: arrastra muchas dependencias y solo se usa en la evaluación con LLM-as-judge.
ragas = ["ragas>=0.3,<0.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyflakes>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars"]

# PyTorch CPU-only en Linux: evita descargar ~2 GB de librerías CUDA para un cross-encoder pequeño.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requiere PostgreSQL con pgvector (variable TEST_DATABASE_URL)"]
addopts = "-q"

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
