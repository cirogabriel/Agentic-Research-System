[alembic]
script_location = alembic
prepend_sys_path = src
# La URL real se toma de ars.config.Settings (DATABASE_URL) en alembic/env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
